[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]
password_hashing = { git = "ssh://git@github.com/Nistoehchelon/password_hashing.git"  }
server = { git = "ssh://git@github.com/Nistoehchelon/server_2_only.git"}
app_config = { path = "workspace_crates/app_config" }
auth_system_structs = { path = "workspace_crates/auth_system_structs" }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["migrate", "postgres", "macros", "runtime-tokio", "time", "tls-rustls-aws-lc-rs"] }
tracing = "0.1.44"
derive_more = { version = "2.1.1", features = ["full"] }
strum = { version = "0.28.0", features = ["derive"] }
reqwest = {version="0.13.5", features = ["json"]}
[workspace.package]
version = "0.0.1"
